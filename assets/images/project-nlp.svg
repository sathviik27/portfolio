<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#0A0A0C" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Self-Attention Grid -->
  <g transform="translate(80, 80)">
    <rect width="300" height="290" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="150" y="32" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">ATTENTION HEAD MAP</text>

    <!-- Matrix Cells -->
    <rect x="30" y="55" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="85" y="55" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.15"/>
    <rect x="140" y="55" width="45" height="45" rx="4" fill="#30D158" opacity="0.6"/>
    <rect x="195" y="55" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.08"/>
    <rect x="250" y="55" width="45" height="45" rx="4" fill="#30D158" opacity="0.3"/>

    <rect x="30" y="110" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.12"/>
    <rect x="85" y="110" width="45" height="45" rx="4" fill="#30D158" opacity="0.75"/>
    <rect x="140" y="110" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="195" y="110" width="45" height="45" rx="4" fill="#30D158" opacity="0.4"/>
    <rect x="250" y="110" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.15"/>

    <rect x="30" y="165" width="45" height="45" rx="4" fill="#30D158" opacity="0.4"/>
    <rect x="85" y="165" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.08"/>
    <rect x="140" y="165" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="195" y="165" width="45" height="45" rx="4" fill="#30D158" opacity="0.2"/>
    <rect x="250" y="165" width="45" height="45" rx="4" fill="#FFFFFF" opacity="0.7"/>

    <text x="30" y="245" fill="#71717A" font-family="monospace" font-size="10">["DistilBERT", "quantized", "transformer", "latency:14ms"]</text>
  </g>

  <!-- Sentiment Polarity -->
  <g transform="translate(420, 80)">
    <rect width="300" height="290" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="150" y="32" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">CLASSIFICATION POLARITY</text>

    <text x="30" y="80" fill="#30D158" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Positive Class (94.8%)</text>
    <rect x="30" y="90" width="240" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
    <rect x="30" y="90" width="228" height="8" rx="4" fill="#30D158"/>

    <text x="30" y="135" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">Neutral Class (4.1%)</text>
    <rect x="30" y="145" width="240" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
    <rect x="30" y="145" width="18" height="8" rx="4" fill="#71717A"/>

    <text x="30" y="190" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">Negative Class (1.1%)</text>
    <rect x="30" y="200" width="240" height="8" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
    <rect x="30" y="200" width="8" height="8" rx="4" fill="#FF2D55"/>
  </g>
</svg>
