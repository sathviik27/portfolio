<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#0A0A0C" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Minimal Grid Background -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800"/>
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450"/>
  </g>

  <!-- Input Frame -->
  <g transform="translate(100, 110)">
    <rect width="180" height="230" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="90" y="35" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">INPUT MATRIX (28x28)</text>
    
    <!-- Drawn 7 -->
    <path d="M50,75 H130 L90,195" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M68,135 H115" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Connectors -->
  <path d="M290,180 C360,180 370,140 430,140" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M290,225 C360,225 370,225 430,225" stroke="#30D158" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M290,270 C360,270 370,310 430,310" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- CNN Feature Layers -->
  <g transform="translate(430, 100)">
    <rect x="0" y="20" width="80" height="190" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="40" y="115" fill="#A1A1AA" font-family="sans-serif" font-size="11" text-anchor="middle">Conv2D</text>
    <text x="40" y="130" fill="#71717A" font-family="sans-serif" font-size="9" text-anchor="middle">32 Filters</text>

    <rect x="50" y="40" width="70" height="150" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="85" y="115" fill="#A1A1AA" font-family="sans-serif" font-size="11" text-anchor="middle">MaxPool</text>
    
    <rect x="100" y="60" width="60" height="110" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="130" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="11" text-anchor="middle">Dense</text>
  </g>

  <!-- Output Inference -->
  <g transform="translate(620, 110)">
    <rect width="130" height="230" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="65" y="35" fill="#71717A" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SOFTMAX</text>

    <text x="25" y="70" fill="#71717A" font-family="monospace" font-size="10">0: 0.01</text>
    <rect x="25" y="75" width="80" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)"/>

    <text x="25" y="105" fill="#71717A" font-family="monospace" font-size="10">1: 0.02</text>
    <rect x="25" y="110" width="80" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)"/>

    <!-- Active Class 7 -->
    <rect x="15" y="128" width="100" height="40" rx="6" fill="rgba(48, 209, 88, 0.1)" stroke="rgba(48, 209, 88, 0.3)" stroke-width="1"/>
    <text x="25" y="146" fill="#30D158" font-family="monospace" font-size="12" font-weight="600">7: 0.992</text>
    <rect x="25" y="153" width="80" height="5" rx="2.5" fill="#30D158"/>

    <text x="25" y="195" fill="#71717A" font-family="monospace" font-size="10">9: 0.03</text>
    <rect x="25" y="200" width="80" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.06)"/>
  </g>
</svg>
