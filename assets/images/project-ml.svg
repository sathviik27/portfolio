<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#0A0A0C" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Decision Tree Diagram -->
  <g transform="translate(70, 70)">
    <rect width="310" height="310" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="155" y="32" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">GRADIENT BOOSTED TREE</text>

    <!-- Root -->
    <rect x="110" y="60" width="90" height="30" rx="6" fill="#FFFFFF"/>
    <text x="155" y="79" fill="#000000" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SqFt &gt; 1850</text>

    <!-- Branches -->
    <path d="M 130,90 L 75,135" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <path d="M 180,90 L 235,135" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>

    <!-- Nodes -->
    <rect x="35" y="135" width="80" height="28" rx="5" fill="#1C1C1F" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="75" y="153" fill="#A1A1AA" font-family="sans-serif" font-size="10" text-anchor="middle">LocScore &lt; 8</text>

    <rect x="195" y="135" width="80" height="28" rx="5" fill="#1C1C1F" stroke="rgba(255, 255, 255, 0.15)"/>
    <text x="235" y="153" fill="#30D158" font-family="sans-serif" font-size="10" text-anchor="middle">Bedrooms &gt; 3</text>

    <!-- Leaves -->
    <circle cx="50" cy="210" r="14" fill="#1C1C1F" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="50" y="214" fill="#A1A1AA" font-family="sans-serif" font-size="9" text-anchor="middle">$320k</text>

    <circle cx="100" cy="210" r="14" fill="#FFFFFF"/>
    <text x="100" y="214" fill="#000000" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">$480k</text>

    <circle cx="210" cy="210" r="14" fill="#1C1C1F" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="210" y="214" fill="#A1A1AA" font-family="sans-serif" font-size="9" text-anchor="middle">$620k</text>

    <circle cx="260" cy="210" r="14" fill="#30D158"/>
    <text x="260" y="214" fill="#000000" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">$890k</text>
  </g>

  <!-- SHAP Values Bar Plot -->
  <g transform="translate(420, 70)">
    <rect width="310" height="310" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="155" y="32" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">SHAP IMPORTANCE METRICS</text>

    <text x="30" y="75" fill="#71717A" font-family="sans-serif" font-size="11">TotalSquareFootage</text>
    <rect x="30" y="83" width="220" height="8" rx="4" fill="#FFFFFF"/>

    <text x="30" y="120" fill="#71717A" font-family="sans-serif" font-size="11">NeighborhoodIndex</text>
    <rect x="30" y="128" width="180" height="8" rx="4" fill="#A1A1AA"/>

    <text x="30" y="165" fill="#71717A" font-family="sans-serif" font-size="11">OverallQualityScore</text>
    <rect x="30" y="173" width="140" height="8" rx="4" fill="#71717A"/>

    <text x="30" y="210" fill="#71717A" font-family="sans-serif" font-size="11">YearBuiltRenovated</text>
    <rect x="30" y="218" width="100" height="8" rx="4" fill="#30D158"/>

    <text x="30" y="255" fill="#71717A" font-family="sans-serif" font-size="11">GarageCapacity</text>
    <rect x="30" y="263" width="60" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
  </g>
</svg>
