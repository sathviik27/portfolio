<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" rx="16" fill="#0A0A0C" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Vector Nodes Minimal -->
  <g transform="translate(80, 80)">
    <rect width="280" height="290" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="140" y="32" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">EMBEDDING SPACE</text>
    
    <circle cx="90" cy="90" r="8" fill="#71717A"/>
    <text x="90" y="112" fill="#71717A" font-family="sans-serif" font-size="9" text-anchor="middle">Calculus Ch.4</text>

    <circle cx="120" cy="160" r="10" fill="#30D158"/>
    <text x="120" y="185" fill="#30D158" font-family="sans-serif" font-size="9" text-anchor="middle">Taylor Series</text>

    <circle cx="210" cy="110" r="8" fill="#FFFFFF"/>
    <text x="210" y="130" fill="#A1A1AA" font-family="sans-serif" font-size="9" text-anchor="middle">Sorting (DSA)</text>

    <circle cx="190" cy="220" r="10" fill="#FFFFFF"/>
    <text x="190" y="246" fill="#A1A1AA" font-family="sans-serif" font-size="9" text-anchor="middle">Binary Heaps</text>

    <line x1="90" y1="90" x2="120" y2="160" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="80" y="130" fill="#71717A" font-family="monospace" font-size="9">cos: 0.94</text>
  </g>

  <!-- Query & Retrieval Pipeline -->
  <g transform="translate(400, 80)">
    <rect width="320" height="290" rx="12" fill="#121215" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="160" y="32" fill="#71717A" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.05em">RETRIEVAL AUGMENTATION</text>

    <!-- Query -->
    <rect x="25" y="60" width="270" height="38" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="40" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="11">Q: "Explain Eigenvalues intuitively"</text>

    <!-- Arrow -->
    <path d="M 160,105 L 160,125" stroke="#71717A" stroke-width="1"/>

    <!-- Context -->
    <rect x="25" y="130" width="270" height="46" rx="8" fill="rgba(48, 209, 88, 0.08)" stroke="rgba(48, 209, 88, 0.2)"/>
    <text x="40" y="150" fill="#30D158" font-family="sans-serif" font-size="10" font-weight="600">Context: Matrix Dynamics (Strang Ch.6)</text>
    <text x="40" y="165" fill="#A1A1AA" font-family="sans-serif" font-size="9">"Directions where linear map acts as pure scaling..."</text>

    <!-- Synthesis -->
    <rect x="25" y="190" width="270" height="66" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="40" y="212" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600">AI Synthesis</text>
    <text x="40" y="228" fill="#A1A1AA" font-family="sans-serif" font-size="9">"An eigenvector retains its spatial direction,</text>
    <text x="40" y="242" fill="#A1A1AA" font-family="sans-serif" font-size="9">scaled strictly by factor lambda (λ)..."</text>
  </g>
</svg>
