<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cupertino Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Subtle Top Specular Sheen -->
  <path d="M 18 3 C 8 3, 3 8, 3 18 L 3 24 C 18 20, 46 20, 61 24 L 61 18 C 61 8, 56 3, 46 3 Z" fill="url(#glowGrad)"/>

  <!-- Neural Connection Nodes -->
  <circle cx="15" cy="18" r="2.5" fill="#34D399" opacity="0.85"/>
  <line x1="17.5" y1="18" x2="22" y2="18" stroke="#34D399" stroke-width="1.5" opacity="0.6"/>
  <circle cx="49" cy="46" r="2.5" fill="#34D399" opacity="0.85"/>
  <line x1="42" y1="46" x2="46.5" y2="46" stroke="#34D399" stroke-width="1.5" opacity="0.6"/>

  <!-- Geometric Minimalist Monogram 'S' -->
  <path d="M 42 18 
           C 42 15, 39 14, 32 14 
           C 25 14, 22 17, 22 21 
           C 22 26, 27 28, 33 29.5 
           C 39 31, 44 33, 44 39 
           C 44 45, 39 50, 31 50 
           C 23 50, 20 45, 20 41" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Center Focal Core Point -->
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF"/>
</svg>
